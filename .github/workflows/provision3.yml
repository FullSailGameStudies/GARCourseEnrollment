name: Provision Student Repository

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  create-repo:
    if: contains(github.event.issue.labels.*.name, 'provision-repo3')
    runs-on: ubuntu-latest
    env:
      ORG_NAME: "FullSailGameStudies"
    steps:
      # ==================== GENERATE ORG BOT TOKEN ====================
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.ORG_NAME }}   # make scope beyond this repo so templates are accessible
      # ================================================================


      - name: Checkout Enrollment Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}


      - name: Parse Configuration, Validate Passcode, and Check Roster Limit
        id: code_check
        env:
          # Use the newly minted App Token to represent the Organization!
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
        run: |
          EXPECTED_HASH=$(grep "# MONTHLY_CODE:" garInfo.txt | head -n1 | sed 's/# MONTHLY_CODE: //g' | tr -d '[:space:]')
          MAX_LIMIT=$(grep "# MAX_REPOS:" garInfo.txt | head -n1 | sed 's/# MAX_REPOS: //g' | tr -d '[:space:]')
          REPO_PREFIX=$(grep "# PREFIX:" garInfo.txt | head -n1 | sed 's/# PREFIX: //g' | tr -d '[:space:]')
          TEMPLATE_NAME=$(grep "# TEMPLATE:" garInfo.txt | head -n1 | sed 's/# TEMPLATE: //g' | tr -d '[:space:]')
                    
          # Parse the code the student entered into the issue form field
          STUDENT_CODE=$(echo "$ISSUE_BODY" | sed -n '/### Claim Code/{n;p;}' | tr -d '[:space:]')
          if [ -z "$STUDENT_CODE" ] || [ "$STUDENT_CODE" = "_No_response_" ]; then
            STUDENT_CODE=$(echo "$ISSUE_BODY" | sed -n '/### Claim Code/{n;n;p;}' | tr -d '[:space:]')
          fi
          STUDENT_HASH=$(echo -n "$STUDENT_CODE" | sha256sum | awk '{print $1}')
          
          # Create an obfuscated version of the issue body, removing the claim code
          REDACTED_BODY=$(echo "$ISSUE_BODY" | sed "s/$STUDENT_CODE/[used claim code]/g")
          
          # overwrite the public text record to protect claim code
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REDACTED_BODY"       


          # Security Check: Validate Passcode Hash
          if [ "$STUDENT_HASH" != "$EXPECTED_HASH" ]; then
            echo "AUTH_FAILED=true" >> $GITHUB_ENV
            echo "::error::Invalid monthly class claim code submitted."
            echo $STUDENT_HASH
            echo $EXPECTED_HASH
            exit 0
          fi
          echo "AUTH_FAILED=false" >> $GITHUB_ENV

          # Capacity Check: Count how many repositories already use our prefix inside the Org  
          # This pulls up to 1000 repos from the Org and uses grep to count names starting with the repo prefix
          CURRENT_COUNT=$(GH_TOKEN="$GH_TOKEN" gh repo list "$ORG" --source --limit 1000 --json name --jq '.[].name' | grep "^$REPO_PREFIX" | wc -l | tr -d '[:space:]')
          
          if [ -z "$CURRENT_COUNT" ]; then
            CURRENT_COUNT=0
          fi
          
          echo "Active repositories using prefix '$REPO_PREFIX' in '$ORG': $CURRENT_COUNT / $MAX_LIMIT"

          if [ "$CURRENT_COUNT" -ge "$MAX_LIMIT" ]; then
            echo "LIMIT_EXCEEDED=true" >> $GITHUB_ENV
            echo "::error::Class capacity seat registration limit reached."
          else
            echo "LIMIT_EXCEEDED=false" >> $GITHUB_ENV
            
            STUDENT_USER="${{ github.event.issue.user.login }}"
            echo "DYNAMIC_REPO_NAME=${REPO_PREFIX}${STUDENT_USER}" >> $GITHUB_ENV
            echo "DYNAMIC_TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV
          fi

      - name: Handle Invalid Passcode
        if: env.AUTH_FAILED == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "❌ **Repository Creation Failed:** The monthly claim code you entered is incorrect. Please verify the code from the course module and try opening a new issue."
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "not_planned"
          exit 1

      - name: Handle Cap Limit Exceeded
        if: env.LIMIT_EXCEEDED == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "🛑 **Workspace Capacity Limit Reached:** All available student workspaces for this active assignment cycle have already been claimed. Please contact your instructor or TA directly to request a seat override allocation."
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "not_planned"
          exit 1

      - name: Check If Repository Already Exists
        if: env.AUTH_FAILED == 'false' && env.LIMIT_EXCEEDED == 'false'
        env:
          GH_TOKEN:  ${{ steps.app_token.outputs.token }}
          ORG: ${{ env.ORG_NAME }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          # Check if the repository can be resolved by the GitHub CLI
          if gh repo view "$ORG/$NEW_REPO_NAME" > /dev/null 2>&1; then
            echo "REPO_EXISTS=true" >> $GITHUB_ENV
            echo "::warning::Repository $ORG/$NEW_REPO_NAME already exists. Skipping creation."
          else
            echo "REPO_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Handle Duplicate Repository Request
        if: env.REPO_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |          
          gh issue comment $ISSUE_NUMBER \
            --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ @$STUDENT You have already requested an assignment repository for this project. 
          
          Your active private workspace is located here: **https://github.com/${ORG}/${NEW_REPO_NAME}**
          
          This duplicate request issue has been closed automatically to prevent overwriting your existing code."

          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "completed"
          exit 0 # Exit gracefully without failing the workflow run entirely
          
      - name: Notify Student of Verification Success
        if: env.AUTH_FAILED == 'false' && env.LIMIT_EXCEEDED == 'false' && env.REPO_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "✅ Verification passed. Creating repo (be patient, this will take a few minutes)"

      - name: Generate and Invite
        # This step only executes if the passcode is correct AND the repo doesn't exist yet
        if: env.AUTH_FAILED == 'false' && env.LIMIT_EXCEEDED == 'false' && env.REPO_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN:  ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          TEMPLATE_REPO: ${{ env.DYNAMIC_TEMPLATE_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
  
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          echo "Creating private repository $NEW_REPO_NAME from template $TEMPLATE_REPO..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/$ORG/$TEMPLATE_REPO/generate \
            -f owner="$ORG" \
            -f name="$NEW_REPO_NAME" \
            -F private=true
            
          # Loops up to 15 times, waiting 3 seconds per attempt (45 seconds total max).
          # It queries the branches endpoint. If it returns an empty bracket '[]' or errors out, it continues waiting.
          echo "Waiting for GitHub to finish generating files from the template..."
          for i in $(seq 1 15); do
            BRANCH_CHECK=$(gh api /repos/$ORG/$NEW_REPO_NAME/branches --jq '.[].name' 2>/dev/null || true)
            if [ -n "$BRANCH_CHECK" ]; then
              echo "Repository files and branches initialized successfully!"
              break
            fi
            echo "Template copy in progress... waiting 3 seconds (Attempt $i/15)"
            sleep 3
          done

          # Add an extra safety cushion sleep to ensure files are fully flushed to disk
          sleep 5
          
          echo "Adding student $STUDENT as a collaborator..."
          # This execution line remains perfectly secure! 
          # It grants individual student visibility while branding the invitation email from the Organization App name.
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/$ORG/$NEW_REPO_NAME/collaborators/$STUDENT \
            -f permission='write'
            
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "@$STUDENT sending email to invite you as a collaborator on your new repo (**https://github.com/${ORG}/${NEW_REPO_NAME}**). Please **check your email** to accept the invitation."


      - name: Initialize Feedback Branch and PR
        if: env.AUTH_FAILED == 'false' && env.LIMIT_EXCEEDED == 'false' && env.REPO_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN:  ${{ steps.app_token.outputs.token }}
          ORG: ${{ env.ORG_NAME }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          echo "Cloning repository: $NEW_REPO_NAME..."
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${NEW_REPO_NAME}.git"
          
          cd "$NEW_REPO_NAME"
          git checkout master
          git checkout -b feedback
          git commit --allow-empty -m "Initialize assignment feedback environment"
          git push origin feedback
          
          # Create an empty commit so the PR has something to compare against          
          git checkout master
          git commit --allow-empty -m "Initialize assignment feedback environment"
          git push origin master

          # wait for the sync to finalize before trying to open the PR
          echo "Verifying remote branch sync before opening tracking PR..."
          for i in $(seq 1 15); do
            MASTER_SHA=$(gh api "/repos/$ORG/$NEW_REPO_NAME/commits/$DEFAULT_BRANCH" --jq '.sha' 2>/dev/null || true)
            FEEDBACK_SHA=$(gh api "/repos/$ORG/$NEW_REPO_NAME/commits/feedback" --jq '.sha' 2>/dev/null || true)
            
            # If both SHAs are successfully populated and are different, the PR is safe to build
            if [ -n "$MASTER_SHA" ] && [ -n "$FEEDBACK_SHA" ] && [ "$MASTER_SHA" != "$FEEDBACK_SHA" ]; then
              echo "Remote repository branches synced perfectly! (Master: $MASTER_SHA, Feedback: $FEEDBACK_SHA)"
              break
            fi
            
            echo "Waiting for GitHub network replication layer... (Attempt $i/10)"
            sleep 2
          done
          
          # Add a tiny final cushion sleep to ensure the tracking indices flush completely
          sleep 3
          
          echo "Opening feedback tracking pull request..."
          gh pr create \
            --repo "${ORG}/${NEW_REPO_NAME}" \
            --title "Grading & Feedback" \
            --body "This Pull Request tracks your assignment progress. Instructors will leave reviews here. Do not close or merge." \
            --base "feedback" \
            --head "master"

      - name: Close Issue and Reply to Student
        if: env.AUTH_FAILED == 'false' && env.LIMIT_EXCEEDED == 'false' && env.REPO_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "@$STUDENT Private repository successfully configured at **https://github.com/${ORG}/${NEW_REPO_NAME}**"
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "completed"
